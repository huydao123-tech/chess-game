spring.application.name=chess-backend
server.port=8080

# SQL Server Configuration
# 1. URL kết nối MySQL (3306 là port mặc định của MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/chessonline?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 2. Driver Class cho MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Tài khoản & Mật khẩu MySQL của mày
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=chess-online-super-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.com.chess=DEBUG
logging.level.org.springframework.security=WARN

